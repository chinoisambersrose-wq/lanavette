# Remplacer api.exemple.fr par le vrai sous-domaine une fois le nom de marque choisi (Lot 0).
# Avant d'avoir un certificat (premiere installation), commenter tout le bloc "443" et la
# redirection, lancer certbot en mode webroot sur le port 80, puis les reactiver.

server {
    listen 80;
    server_name api.exemple.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.exemple.fr;

    ssl_certificate /etc/letsencrypt/live/api.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.exemple.fr/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
