# A copier sur le VPS avec .env (voir deploy/README.md). MongoDB n'est pas ici : c'est Atlas
# (hors Docker), conformement au choix de stack dans CLAUDE.md.
#
# Pas de conteneur nginx ici : ce VPS est partage avec d'autres sites deja en prod, avec leur
# propre nginx systeme (hors Docker) deja proprietaire des ports 80/443. L'API publie donc son
# port directement sur le host (API_HOST_PORT, 4100 par defaut sur ce VPS — 4000 y est deja pris
# par un autre service) ; une fois un domaine choisi, un nouveau site est ajoute au nginx
# systeme existant pour reverse-proxier vers ce port (voir deploy/nginx/api.conf).
services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-chinoisambersrose-wq/lanavette}/api:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - '${API_HOST_PORT:-4100}:4000'
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
