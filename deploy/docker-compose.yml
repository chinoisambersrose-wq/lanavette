# A copier sur le VPS avec nginx/ et .env (voir deploy/README.md). MongoDB n'est pas ici :
# c'est Atlas (hors Docker), conformement au choix de stack dans CLAUDE.md.
services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-chinoisambersrose-wq/lanavette}/api:latest
    restart: unless-stopped
    env_file: .env
    expose:
      - '4000'
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
