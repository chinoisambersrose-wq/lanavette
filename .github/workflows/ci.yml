name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dependances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verifier le formatage
        run: npm run format:check

      # apps/vitrine est exclu : son build appelle l'API au build (donnees du catalogue) et
      # necessite donc une base MongoDB et une API demarrees, non montees dans cette CI.
      - name: Build (shared, api, app)
        run: |
          npm run build -w packages/shared
          npm run build -w apps/api
          npm run build -w apps/app

      - name: Tests
        run: npm test
